<!DOCTYPE.html>
<html>
  <head>
    <style>
      body{background-color: pink}
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale="1.0">
    <title>Feedback Page</title>
    
  </head>
  <body>
      <h1>Remember to give us a feedback</h1>
      <p>Your feedback helps us know what to improve and change at MB Pretty Tips and Beats</p>
    
    <form action="https://formspree.io/f/xwvaqvqq" method="POST" onsubmit="showMessage()">
      <label for="rating">Rating:</label><br>
      <select id="rating" name="rating">
        <option value="excellent">Excellent</option>
        <option value="good">Good</option>
        <option value="average">Average</option>
        <option value="poor">Poor</option>
      </select><br><br>
      
      <label for="message">Your Feedback:</label><br>
        <textarea ids="message" name="message" required></textarea><br><br>
      
        <button type="submit">Submit Feedback</button>
      
    </form>
    <p id="successMsg" style="color: green; font-weight: bold;"></p>
    <script>
      function showMessage() {
        document.getElementById("successMsg").innerText =
          "Feedback submitted successfully!";
      }
      
    </script>
  </body>
</html>
