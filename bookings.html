 <head>

 </head>
 <body>
   <h1>Book with us today!</h1>

   <form>
     <label> Full name and surname:</label>
     <input type="text">

     <label> Phone Number:</label>
     <input type="tel" id="phone" name="phone" required>

     <label for="date"> Date of booking:</label><br>
     <input type="date" id="date" name="date" required>

     <label for="time"> Time of booking:</label><br>
     <input type="time" id="time" name="time" required>

     <label for="message">Message:</label><br>
     <textarea id="message" required></textarea><br><br>

     <button type="submit">Submit</button>
   </form>
   <p id="notification" style="color: green; font-weight: bold;"></p>
   <script>
     function showMessage(event) {
        event.preventDefault(); // stops page refresh
        document.getElementByID("notifictation").innerText =
         "Submission successful Thank you for your feedback.";

        // Optional: clear form after submit
        document.querySelector("form").reset();
         return false;
     }
    
    
   </script>
